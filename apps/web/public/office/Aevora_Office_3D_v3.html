<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
await document.fonts.ready;
const scene = stage._scene, cam = stage._camera, controls = stage._controls, renderer = stage._renderer;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;

let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = a => a[(rnd() * a.length) | 0];
const V3 = THREE.Vector3, ONE = new V3(1, 1, 1), _y = new V3(0, 1, 0);

// ---------- procedural textures ----------
function canvasTex(w, h, draw, { repeat = false, data = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function noise(g, w, h, a) {
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - 0.5) * a; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
}
function vein(g, x, y, a, len, width, col, jitter = 0.25) {
  g.strokeStyle = col; g.lineWidth = width; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y);
  for (let i = 0; i < len; i += 6) { a += (Math.random() - 0.5) * jitter; x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
  g.stroke();
}
// marble: 2x2 tiles (1.2 m each) per texture repeat
const marbleTex = canvasTex(2048, 2048, (g, w, h) => {
  const s = w / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    g.save(); g.beginPath(); g.rect(i * s, j * s, s, s); g.clip();
    const base = g.createLinearGradient(i * s, j * s, i * s + s, j * s + s);
    base.addColorStop(0, '#f3f1ed'); base.addColorStop(1, '#e8e4dd'); g.fillStyle = base; g.fillRect(i * s, j * s, s, s);
    g.filter = 'blur(18px)';
    for (let k = 0; k < 16; k++) { g.fillStyle = `rgba(${190 + rnd() * 20},${186 + rnd() * 20},${180 + rnd() * 16},0.18)`; g.beginPath(); g.ellipse(i * s + rnd() * s, j * s + rnd() * s, 40 + rnd() * 160, 20 + rnd() * 60, rnd() * 3, 0, 7); g.fill(); }
    const a0 = rnd() * Math.PI;
    g.filter = 'blur(2.5px)';
    for (let k = 0; k < 5; k++) vein(g, i * s + rnd() * s, j * s + rnd() * s, a0 + (rnd() - 0.5) * 0.6, 900, 3 + rnd() * 5, 'rgba(150,144,136,0.28)');
    g.filter = 'blur(0.6px)';
    for (let k = 0; k < 9; k++) vein(g, i * s + rnd() * s, j * s + rnd() * s, a0 + (rnd() - 0.5) * 1.2, 500 + rnd() * 500, 0.8 + rnd() * 1.6, 'rgba(110,104,98,0.45)', 0.4);
    for (let k = 0; k < 4; k++) vein(g, i * s + rnd() * s, j * s + rnd() * s, a0 + 0.3, 700, 1.2, 'rgba(176,150,112,0.35)', 0.35);
    g.filter = 'none'; g.restore();
  }
  noise(g, w, h, 5);
  g.fillStyle = '#c9c3b9'; for (let k = 0; k <= 2; k++) { g.fillRect(k * s - 1.5, 0, 3, h); g.fillRect(0, k * s - 1.5, w, 3); }
}, { repeat: true });
const carpetTex = canvasTex(1024, 1024, (g, w, h) => {
  const s = w / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const L = 88 + (rnd() - 0.5) * 10; g.fillStyle = `rgb(${L},${L + 3},${L + 10})`; g.fillRect(i * s, j * s, s, s);
    const hz = (i + j) % 2;
    for (let k = 0; k < s; k += 3) {
      g.fillStyle = `rgba(${k % 6 ? 255 : 0},${k % 6 ? 255 : 0},${k % 6 ? 255 : 0},0.05)`;
      hz ? g.fillRect(i * s, j * s + k, s, 1.5) : g.fillRect(i * s + k, j * s, 1.5, s);
    }
  }
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - 0.5) * 60 * (Math.random() > 0.5 ? 1 : 0.4); p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
  g.fillStyle = 'rgba(0,0,0,0.35)'; for (let k = 0; k <= 2; k++) { g.fillRect(k * s - 1, 0, 2, h); g.fillRect(0, k * s - 1, w, 2); }
}, { repeat: true });
function plankTex(hue, sat, l0, l1, planks, seams = true) {
  return canvasTex(1024, 1024, (g, w, h) => {
    const pw = w / planks;
    for (let i = 0; i < planks; i++) {
      let y = -rnd() * 500;
      while (y < h) {
        const len = seams ? 380 + rnd() * 420 : h * 2, L = l0 + rnd() * (l1 - l0);
        g.fillStyle = `hsl(${hue + (rnd() - 0.5) * 4}, ${sat}%, ${L}%)`; g.fillRect(i * pw, y, pw, len);
        for (let k = 0; k < pw * 0.5; k++) {
          g.strokeStyle = `hsla(${hue - 4}, ${sat + 6}%, ${L * 0.55}%, ${0.05 + rnd() * 0.16})`; g.lineWidth = 0.5 + rnd() * 1.8; g.beginPath();
          const x0 = i * pw + rnd() * pw, amp = 2 + rnd() * 7, f = 0.004 + rnd() * 0.01, ph = rnd() * 6;
          g.moveTo(x0, y); for (let t = 0; t <= len; t += 12) g.lineTo(x0 + Math.sin(t * f + ph) * amp, y + t); g.stroke();
        }
        if (rnd() > 0.6) { g.strokeStyle = `hsla(${hue - 6}, ${sat}%, ${L * 0.5}%, 0.35)`; g.lineWidth = 1.2; const cx = i * pw + pw * (0.3 + rnd() * 0.4), cy = y + rnd() * len; for (let r = 3; r < 16; r += 3) { g.beginPath(); g.ellipse(cx, cy, r * 0.6, r * 2.2, 0, 0, 7); g.stroke(); } }
        if (seams) { g.fillStyle = 'rgba(20,12,6,0.55)'; g.fillRect(i * pw, y, pw, 2); }
        y += len;
      }
      if (seams) { g.fillStyle = 'rgba(20,12,6,0.5)'; g.fillRect(i * pw, 0, 1.5, h); }
    }
    noise(g, w, h, 6);
  }, { repeat: true });
}
const oakFloorTex = plankTex(32, 36, 52, 60, 7);
const darkWoodTex = plankTex(20, 38, 15, 21, 9);
const walnutTex = plankTex(24, 34, 27, 33, 4, false);
const deskOakTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = 'hsl(34, 38%, 70%)'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 420; k++) {
    g.strokeStyle = `hsla(30, 42%, ${40 + rnd() * 18}%, ${0.04 + rnd() * 0.12})`; g.lineWidth = 0.5 + rnd() * 1.8; g.beginPath();
    const y0 = rnd() * h, amp = 3 + rnd() * 10, f = 0.003 + rnd() * 0.008, ph = rnd() * 6;
    g.moveTo(0, y0); for (let x = 0; x <= w; x += 12) g.lineTo(x, y0 + Math.sin(x * f + ph) * amp); g.stroke();
  }
  noise(g, w, h, 5);
}, { repeat: true });
const ceilingTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#efeeea'; g.fillRect(0, 0, w, h);
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = Math.random() > 0.93 ? -26 : (Math.random() - 0.5) * 8; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
  const s = w / 2;
  for (let k = 0; k <= 2; k++) { g.fillStyle = '#d6d4cf'; g.fillRect(k * s - 5, 0, 10, h); g.fillRect(0, k * s - 5, w, 10); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(k * s + 5, 0, 2, h); g.fillRect(0, k * s + 5, w, 2); }
}, { repeat: true });
const fabricTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) { g.fillStyle = ((x + y) / 4) % 2 ? '#9a9a9a' : '#6a6a6a'; g.fillRect(x, y, 3, 3); }
  noise(g, w, h, 40);
}, { repeat: true, data: true });
const radialAlpha = canvasTex(256, 256, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, '#fff'); r.addColorStop(0.45, '#999'); r.addColorStop(0.75, '#333'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
}, { data: true });
const edgeAlpha = canvasTex(8, 256, (g, w, h) => {
  const r = g.createLinearGradient(0, 0, 0, h); r.addColorStop(0, '#fff'); r.addColorStop(0.35, '#777'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
}, { data: true });
const glowTex = canvasTex(256, 256, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, '#fff'); r.addColorStop(0.3, '#8a8a8a'); r.addColorStop(0.65, '#262626'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
function dash(accents) {
  return canvasTex(512, 288, (g, w, h) => {
    g.fillStyle = '#0f1426'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#18203a'; g.fillRect(0, 0, w, 26);
    g.fillStyle = 'rgba(233,233,237,0.75)'; g.fillRect(14, 10, 90, 6);
    for (let c = 0; c < 3; c++) { g.fillStyle = '#161d35'; g.fillRect(14 + c * 164, 38, 152, 50); g.fillStyle = accents[c % 3]; g.fillRect(24 + c * 164, 60, 40 + rnd() * 70, 10); g.fillStyle = 'rgba(233,233,237,0.5)'; g.fillRect(24 + c * 164, 48, 50, 5); }
    g.fillStyle = '#161d35'; g.fillRect(14, 100, 300, 176); g.fillRect(326, 100, 172, 176);
    g.fillStyle = accents[0];
    for (let i = 0; i < 12; i++) { const bh = 20 + rnd() * 120; g.fillRect(28 + i * 23, 262 - bh, 13, bh); }
    g.strokeStyle = accents[1]; g.lineWidth = 2.5; g.beginPath();
    for (let i = 0; i <= 8; i++) { const x = 340 + i * 18, y = 240 - rnd() * 60 - i * 12; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  });
}
function mapTex() {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#081330'; g.fillRect(0, 0, w, h);
    for (let y = 14; y < h - 8; y += 10) for (let x = 8; x < w - 6; x += 10) {
      const nx = x / w, ny = y / h;
      const land = Math.sin(nx * 9) * Math.cos(ny * 6 + nx * 3) + Math.sin(nx * 21 + ny * 4) * 0.4 > 0.25 && ny > 0.12 && ny < 0.88;
      if (land) { g.fillStyle = rnd() > 0.95 ? '#ffd27a' : 'rgba(110,170,255,0.8)'; g.beginPath(); g.arc(x, y, 2.4, 0, 7); g.fill(); }
    }
  });
}
const skyTex = canvasTex(4096, 512, (g, w, h) => {
  const s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, '#0b0e1c'); s.addColorStop(0.55, '#1a1c34'); s.addColorStop(0.85, '#3a3350'); s.addColorStop(1, '#4a3f58');
  g.fillStyle = s; g.fillRect(0, 0, w, h);
  for (const [tone, maxH, lit] of [['#151828', 300, 0.25], ['#0d0f1a', 420, 0.35]]) {
    for (let x = 0; x < w;) {
      const bw = 30 + rnd() * 90, bh = 60 + rnd() * maxH;
      g.fillStyle = tone; g.fillRect(x, h - bh, bw, bh);
      for (let yy = h - bh + 8; yy < h - 4; yy += 9) for (let xx = x + 4; xx < x + bw - 4; xx += 7) if (rnd() < lit) { g.fillStyle = rnd() > 0.3 ? 'rgba(255,214,160,0.85)' : 'rgba(190,210,255,0.7)'; g.fillRect(xx, yy, 3, 4); }
      x += bw + rnd() * 6;
    }
  }
});

// ---------- floor reflection (planar, walk mode) ----------
const reflRT = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
const reflCam = new THREE.PerspectiveCamera();
const reflU = { tRefl: { value: reflRT.texture }, uTexMat: { value: new THREE.Matrix4() }, uReflOn: { value: 0 } };
function addReflection(m, k) {
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, reflU, { uReflK: { value: k } });
    sh.vertexShader = 'varying vec3 vWPosR;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPosR = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform sampler2D tRefl; uniform mat4 uTexMat; uniform float uReflOn; uniform float uReflK; varying vec3 vWPosR;\n' +
      sh.fragmentShader.replace('#include <tonemapping_fragment>', `
      if (uReflOn > 0.5) {
        vec4 pc = uTexMat * vec4(vWPosR, 1.0); vec2 ruv = pc.xy / pc.w; vec2 o = vec2(0.0025, 0.004);
        vec3 r = texture2D(tRefl, ruv).rgb * 0.36 + (texture2D(tRefl, ruv + vec2(o.x, 0.0)).rgb + texture2D(tRefl, ruv - vec2(o.x, 0.0)).rgb + texture2D(tRefl, ruv + vec2(0.0, o.y)).rgb + texture2D(tRefl, ruv - vec2(0.0, o.y)).rgb) * 0.16;
        float ndv = clamp(normalize(cameraPosition - vWPosR).y, 0.0, 1.0);
        float fres = 0.25 + 0.75 * pow(1.0 - ndv, 4.0);
        gl_FragColor.rgb += r * uReflK * fres;
      }
      #include <tonemapping_fragment>`);
  };
  m.customProgramCacheKey = () => 'refl' + k;
}

// ---------- materials ----------
const M = {};
const mat = (name, o, Cls = THREE.MeshStandardMaterial) => (M[name] = Object.assign(new Cls(o), { name }));
mat('marble',      { color: '#dedad3', map: marbleTex, roughness: 0.1, envMapIntensity: 0.9 }); addReflection(M.marble, 0.4);
mat('slab',        { color: '#b9b5ae', roughness: 0.6 });
mat('carpet',      { color: '#ffffff', map: carpetTex, bumpMap: carpetTex, bumpScale: 2, roughness: 1, envMapIntensity: 0.2 });
mat('woodFloor',   { color: '#ffffff', map: oakFloorTex, roughness: 0.32 }); addReflection(M.woodFloor, 0.22);
mat('darkWood',    { color: '#ffffff', map: darkWoodTex, roughness: 0.18, envMapIntensity: 1.2 }); addReflection(M.darkWood, 0.45);
mat('wallPaint',   { color: '#e9e6e0', roughness: 0.9 });
mat('skirting',    { color: '#2a2b30', roughness: 0.5 });
mat('woodPanel',   { color: '#ffffff', map: walnutTex, roughness: 0.45 });
mat('mullion',     { color: '#34373e', roughness: 0.3, metalness: 0.75 });
mat('glass',       { color: '#f2f6ff', roughness: 0.0, metalness: 0.0, ior: 1.52, specularIntensity: 1, transparent: true, opacity: 0.14, depthWrite: false, envMapIntensity: 4 }, THREE.MeshPhysicalMaterial);
mat('extGlass',    { color: '#9fb0c8', roughness: 0.0, metalness: 0.1, transparent: true, opacity: 0.2, depthWrite: false, envMapIntensity: 3.5 }, THREE.MeshPhysicalMaterial);
mat('frosted',     { color: '#f4f4f2', roughness: 0.7, transparent: true, opacity: 0.55, depthWrite: false });
mat('deskTop',     { color: '#f1f0ec', roughness: 0.28 });
mat('deskOak',     { color: '#ffffff', map: deskOakTex, roughness: 0.42 });
mat('metal',       { color: '#c4c7cc', roughness: 0.28, metalness: 0.85 });
mat('darkMetal',   { color: '#2b2d33', roughness: 0.38, metalness: 0.6 });
mat('brushed',     { color: '#d4d5d8', roughness: 0.22, metalness: 0.95 });
mat('oak',         { color: '#ffffff', map: deskOakTex, roughness: 0.45 });
mat('walnut',      { color: '#ffffff', map: walnutTex, roughness: 0.32 });
mat('chairFabric', { color: '#3a3d45', map: fabricTex, bumpMap: fabricTex, bumpScale: 1.5, roughness: 0.95 });
mat('chairPlastic',{ color: '#1c1d21', roughness: 0.45 });
mat('chairPad',    { color: '#26272b', roughness: 0.6 });
mat('acoustic',    { color: '#8b96a2', map: fabricTex, bumpMap: fabricTex, bumpScale: 1, roughness: 1 });
mat('sofaFabric',  { color: '#b3aa9b', map: fabricTex, bumpMap: fabricTex, bumpScale: 1, roughness: 1 });
mat('sofaDark',    { color: '#4d5260', map: fabricTex, bumpMap: fabricTex, bumpScale: 1, roughness: 1 });
mat('leather',     { color: '#2c201a', roughness: 0.38 });
mat('rug',         { color: '#8e877c', map: fabricTex, roughness: 1 });
mat('leafA',       { color: '#2f5a2a', roughness: 0.55, side: THREE.DoubleSide });
mat('leafB',       { color: '#467a36', roughness: 0.55, side: THREE.DoubleSide });

    if (keys.has('KeyD')) s++; if (keys.has('KeyA')) s--;

    const p = cam.position;
    if (f || s) {
      const l = Math.hypot(f, s); f /= l; s /= l;
      const dx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp, dz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
      if (!blocked(p.x + dx, p.z)) p.x += dx;
      if (!blocked(p.x, p.z + dz)) p.z += dz;
      bob += dt * (run ? 13 : 8);
    }
    p.y = EYE + Math.sin(bob) * 0.02;
    cam.rotation.set(pitch, yaw, 0, 'YXZ'); cam.updateMatrixWorld();
    const z = ZONES.slice().reverse().find(z => p.x >= z.rect[0] && p.x <= z.rect[1] && p.z >= z.rect[2] && p.z <= z.rect[3]);
    const label = z ? z.name : 'Main concourse';
    if (label !== lastZone) { ui.where.textContent = label; lastZone = label; }
    renderReflection();
    renderer.render(scene, cam);
  } else {
    if (fly) { fly.t = Math.min(1, fly.t + dt / 1.2); const k = 1 - Math.pow(1 - fly.t, 3);
      cam.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if (fly.t >= 1) fly = null; }
    orig();
  }
};
stage._loop = loop; renderer.setAnimationLoop(loop);
</script>
