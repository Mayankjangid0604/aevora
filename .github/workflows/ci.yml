name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aevora
          POSTGRES_PASSWORD: aevora
          POSTGRES_DB: aevora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aevora -d aevora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI container only. Never point CI at the live Neon DB.
      DATABASE_URL: postgresql://aevora:aevora@localhost:5432/aevora_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prisma generate
        working-directory: packages/database
        run: npx prisma generate

      # Informational until a DB-backed test exists; make it required then.
      # Turbo's strict env mode also needs DATABASE_URL in turbo.json passThroughEnv for such tests.
      - name: Apply migrations to CI Postgres (informational)
        working-directory: packages/database
        continue-on-error: true
        run: npx prisma migrate deploy

      - name: Build
        run: npx turbo run build

      - name: Test
        run: npm test
